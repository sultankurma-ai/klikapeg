<!doctype html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/assets/logo.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KlikApeg - Pengadilan Agama Lumajang</title>
  <!-- Google Fonts: Epilogue & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
  <link
    href="https://fonts.googleapis.com/css2?family=Epilogue:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet" />
  <!-- Material Symbols Outlined -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
    rel="stylesheet" />
</head>

<body class="bg-background text-on-background font-body-md antialiased min-h-screen">
  <script>
    // Pembersihan instan seluruh cache data contoh lama di browser
    (function () {
      try {
        ['klikapeg_db_cache_spd', 'klikapeg_db_cache_st', 'klikapeg_spd_list', 'klikapeg_surat_tugas_list', 'klikapeg_users_list'].forEach(function (key) {
          var val = localStorage.getItem(key);
          if (val && (val.indexOf('Siti Rahmawati') !== -1 || val.indexOf('SPD/142') !== -1 || val.indexOf('ST/304') !== -1 || val.indexOf('Muhammad Syaifuddin') !== -1 || val.indexOf('ST-2026') !== -1 || val.indexOf('SPD-2026') !== -1)) {
            localStorage.removeItem(key);
          }
        });
      } catch (e) { }
    })();
  </script>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
